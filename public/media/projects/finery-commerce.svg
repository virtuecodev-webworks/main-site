    <rect x="72" y="498" width="150" height="10" rx="5" fill="#3a3a3f"/>
    <rect x="72" y="522" width="90" height="9" rx="4.5" fill="#c4c4cc"/>
    <text x="72" y="566" font-family="Poppins, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">$84.00</text>

    <rect x="330" y="294" width="262" height="300" rx="18" fill="#ffffff"/>
    <rect x="330" y="294" width="262" height="180" rx="18" fill="url(#f-p2)"/>
    <rect x="354" y="498" width="150" height="10" rx="5" fill="#3a3a3f"/>
    <rect x="354" y="522" width="90" height="9" rx="4.5" fill="#c4c4cc"/>
    <text x="354" y="566" font-family="Poppins, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">$52.50</text>

    <rect x="612" y="294" width="262" height="300" rx="18" fill="#ffffff"/>
    <rect x="612" y="294" width="262" height="180" rx="18" fill="url(#f-p3)"/>
    <rect x="636" y="498" width="150" height="10" rx="5" fill="#3a3a3f"/>
    <rect x="636" y="522" width="90" height="9" rx="4.5" fill="#c4c4cc"/>
    <text x="636" y="566" font-family="Poppins, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">$126.00</text>

    <rect x="894" y="294" width="258" height="300" rx="18" fill="#ffffff"/>
    <rect x="894" y="294" width="258" height="180" rx="18" fill="url(#f-p2)"/>
    <rect x="918" y="498" width="150" height="10" rx="5" fill="#3a3a3f"/>
    <rect x="918" y="522" width="90" height="9" rx="4.5" fill="#c4c4cc"/>
    <text x="918" y="566" font-family="Poppins, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">$39.00</text>
  </g>

  <!-- footer note -->
  <rect x="48" y="624" width="420" height="12" rx="6" fill="#1a1a1a" opacity="0.12"/>
  <rect x="48" y="650" width="300" height="10" rx="5" fill="#1a1a1a" opacity="0.08"/>
  <rect x="900" y="632" width="252" height="40" rx="20" fill="#1a1a1a"/>
  <text x="946" y="658" font-family="Poppins, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Checkout secured</text>
