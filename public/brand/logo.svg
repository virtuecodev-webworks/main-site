<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Virtue &amp; Co. Webworks">
  <defs>
    <linearGradient id="vw-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C84A"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>
  </defs>
  <!-- Charcoal tile -->
  <rect width="96" height="96" rx="20" fill="#0B0B0D"/>
  <!-- Hairline border -->
  <rect x="0.5" y="0.5" width="95" height="95" rx="19.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- VW combined monogram — filled polygon, gold gradient -->
  <!-- Shape: outer V silhouette with inner W valley, all converging to bottom point -->
  <g transform="translate(48,50) scale(0.68) translate(-50,-41)">
    <polygon points="5,2 23,2 37,32 50,20 63,32 77,2 95,2 50,80" fill="url(#vw-gold)"/>
  </g>
</svg>
