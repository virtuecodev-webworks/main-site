<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Finery online storefront">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7f1"/>
      <stop offset="100%" stop-color="#f4ece1"/>
    </linearGradient>
    <linearGradient id="f-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6f2a"/>
    </linearGradient>
    <linearGradient id="f-p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2118"/>
      <stop offset="100%" stop-color="#4a3a24"/>
    </linearGradient>
    <linearGradient id="f-p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4a2a"/>
      <stop offset="100%" stop-color="#a87a3f"/>
    </linearGradient>
    <linearGradient id="f-p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2a24"/>
      <stop offset="100%" stop-color="#3d5445"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#f-bg)"/>

  <!-- chrome -->
  <rect x="0" y="0" width="1200" height="52" fill="#ffffff"/>
  <circle cx="34" cy="26" r="6" fill="#dadade"/>
  <circle cx="56" cy="26" r="6" fill="#dadade"/>
  <circle cx="78" cy="26" r="6" fill="#dadade"/>
  <rect x="112" y="14" width="360" height="24" rx="12" fill="#f1f1f4"/>
  <text x="132" y="31" font-family="Poppins, Segoe UI, sans-serif" font-size="13" fill="#9a9aa3">finery.com/shop</text>

  <!-- nav -->
  <rect x="0" y="52" width="1200" height="66" fill="#ffffff"/>
  <rect x="48" y="76" width="26" height="26" rx="8" fill="url(#f-gold)"/>
  <text x="86" y="94" font-family="Poppins, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">FINERY</text>
  <g fill="#55555c">
    <rect x="470" y="82" width="52" height="9" rx="4.5"/>
    <rect x="546" y="82" width="66" height="9" rx="4.5"/>
    <rect x="636" y="82" width="44" height="9" rx="4.5"/>
    <rect x="704" y="82" width="58" height="9" rx="4.5"/>
  </g>
  <rect x="1042" y="74" width="110" height="30" rx="15" fill="url(#f-gold)"/>
  <text x="1064" y="94" font-family="Poppins, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#1a1508">Cart · 3</text>

