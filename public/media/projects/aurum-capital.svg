  <path d="M762 372 L818 340 L874 352 L930 300 L986 312 L1042 256 L1098 268 L1130 232 L1130 388 L762 388 Z"
        fill="url(#a-area)"/>

  <!-- stat chips -->
  <g>
    <rect x="256" y="424" width="288" height="126" rx="18" fill="#ffffff" opacity="0.045"/>
    <rect x="288" y="456" width="60" height="8" rx="4" fill="#ffffff" opacity="0.24"/>
    <text x="288" y="512" font-family="Poppins, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#f5f5f7">14</text>
    <rect x="360" y="500" width="120" height="9" rx="4.5" fill="#ffffff" opacity="0.22"/>

    <rect x="572" y="424" width="288" height="126" rx="18" fill="#ffffff" opacity="0.045"/>
    <rect x="604" y="456" width="60" height="8" rx="4" fill="#ffffff" opacity="0.24"/>
    <text x="604" y="512" font-family="Poppins, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#f5f5f7">₦84.2M</text>

    <rect x="888" y="424" width="272" height="126" rx="18" fill="#ffffff" opacity="0.045"/>
    <rect x="920" y="456" width="60" height="8" rx="4" fill="#ffffff" opacity="0.24"/>
    <text x="920" y="512" font-family="Poppins, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#f5f5f7">A+ KYC</text>
