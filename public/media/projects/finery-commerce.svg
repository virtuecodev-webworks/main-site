  <rect x="48" y="146" width="1104" height="118" rx="20" fill="url(#f-gold)"/>
  <text x="88" y="196" font-family="Poppins, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#1a1508">The Autumn drop</text>
  <rect x="88" y="212" width="300" height="10" rx="5" fill="#1a1508" opacity="0.35"/>
  <rect x="88" y="232" width="180" height="24" rx="12" fill="#1a1508" opacity="0.85"/>

