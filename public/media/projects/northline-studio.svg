<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Northline Studio brand launch site">
  <defs>
    <linearGradient id="n-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="60%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="n-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6f2a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3e3a6"/>
    </linearGradient>
    <radialGradient id="n-bloom" cx="30%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="n-img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2b33"/>
      <stop offset="100%" stop-color="#161619"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#n-bg)"/>
  <rect width="1200" height="750" fill="url(#n-bloom)"/>

  <!-- chrome -->
  <rect x="0" y="0" width="1200" height="52" fill="#ffffff" opacity="0.05"/>
  <circle cx="34" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="26" r="6" fill="#febc2e"/>
  <circle cx="78" cy="26" r="6" fill="#28c840"/>
  <rect x="112" y="14" width="340" height="24" rx="12" fill="#ffffff" opacity="0.08"/>
  <text x="132" y="31" font-family="Poppins, Segoe UI, sans-serif" font-size="13" fill="#c8c8d0">northline.studio</text>

  <!-- nav -->
  <circle cx="72" cy="102" r="15" fill="url(#n-gold)"/>
  <text x="100" y="108" font-family="Poppins, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#f5f5f7">NORTHLINE</text>
  <g fill="#ffffff" opacity="0.3">
    <rect x="900" y="98" width="54" height="9" rx="4.5"/>
    <rect x="974" y="98" width="70" height="9" rx="4.5"/>
    <rect x="1064" y="98" width="46" height="9" rx="4.5"/>
  </g>

  <!-- oversized headline -->
  <text x="60" y="270" font-family="Poppins, Segoe UI, sans-serif" font-size="104" font-weight="700" fill="#f5f5f7" letter-spacing="-3">Design that</text>
  <text x="60" y="376" font-family="Poppins, Segoe UI, sans-serif" font-size="104" font-weight="700" fill="url(#n-gold)" letter-spacing="-3">earns attention.</text>
  <rect x="64" y="410" width="420" height="12" rx="6" fill="#ffffff" opacity="0.22"/>
  <rect x="64" y="434" width="300" height="12" rx="6" fill="#ffffff" opacity="0.14"/>

  <!-- CTAs -->
  <rect x="64" y="482" width="196" height="52" rx="26" fill="url(#n-gold)"/>
  <text x="104" y="514" font-family="Poppins, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#1a1508">Start a project</text>
  <rect x="276" y="482" width="168" height="52" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.28"/>
  <text x="316" y="514" font-family="Poppins, Segoe UI, sans-serif" font-size="16" fill="#e6e6ea">See work</text>

  <!-- project thumbnails -->
  <g>
    <rect x="672" y="150" width="216" height="216" rx="20" fill="url(#n-img)"/>
    <rect x="912" y="150" width="216" height="216" rx="20" fill="url(#n-img)"/>
    <rect x="672" y="390" width="216" height="216" rx="20" fill="url(#n-img)"/>
    <rect x="912" y="390" width="216" height="216" rx="20" fill="url(#n-img)"/>
    <g fill="url(#n-gold)" opacity="0.7">
      <circle cx="780" cy="258" r="34"/>
      <circle cx="1020" cy="300" r="24"/>
      <rect x="716" y="464" width="128" height="68" rx="10"/>
      <circle cx="1020" cy="498" r="40"/>
    </g>
  </g>

  <!-- footer meta -->
  <rect x="60" y="628" width="1068" height="1" fill="#ffffff" opacity="0.12"/>
  <g fill="#ffffff" opacity="0.26">
    <rect x="60" y="660" width="90" height="9" rx="4.5"/>
    <rect x="180" y="660" width="120" height="9" rx="4.5"/>
    <rect x="330" y="660" width="70" height="9" rx="4.5"/>
  </g>
</svg>
