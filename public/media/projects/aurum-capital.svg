  <rect x="730" y="180" width="430" height="216" rx="20" fill="#ffffff" opacity="0.05"/>
  <text x="762" y="222" font-family="Poppins, Segoe UI, sans-serif" font-size="15" fill="#9a9aa3">Performance · 12 months</text>
  <path d="M762 372 L818 340 L874 352 L930 300 L986 312 L1042 256 L1098 268 L1130 232"
