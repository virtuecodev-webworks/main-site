  <rect x="256" y="576" width="904" height="140" rx="20" fill="#ffffff" opacity="0.045"/>
  <g fill="#ffffff" opacity="0.2">
    <rect x="288" y="606" width="70" height="8" rx="4"/>
    <rect x="288" y="646" width="150" height="9" rx="4.5"/>
    <rect x="288" y="674" width="118" height="9" rx="4.5"/>
    <rect x="560" y="646" width="90" height="9" rx="4.5"/>
    <rect x="560" y="674" width="70" height="9" rx="4.5"/>
    <rect x="820" y="646" width="110" height="9" rx="4.5"/>
    <rect x="820" y="674" width="84" height="9" rx="4.5"/>
  </g>
  <rect x="1050" y="640" width="80" height="28" rx="14" fill="url(#a-gold)" opacity="0.9"/>
